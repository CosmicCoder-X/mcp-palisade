name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=palisade --cov-report=term-missing

      # Windows defaults to a cp1252 console, which cannot encode the
      # characters this tool exists to surface. Running the scanner for real on
      # both platforms is what catches that class of regression.
      - name: Scan the clean fixture (must pass)
        run: palisade scan fixtures/benign.json

      - name: Scan the poisoned fixture (must fail)
        shell: bash
        run: |
          if palisade scan fixtures/poisoned.json --quiet; then
            echo "::error::poisoned fixture did not trigger a non-zero exit"
            exit 1
          fi

      - name: Fixtures are reproducible from their generator
        shell: bash
        run: |
          python fixtures/generate.py
          git diff --exit-code fixtures/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-palisade"
version = "0.1.0"
description = "Security scanner for Model Context Protocol servers: detects tool poisoning, rug pulls, cross-server shadowing, and exfiltration-shaped schemas."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Divyansh Agrawal" }]
keywords = ["mcp", "security", "prompt-injection", "supply-chain", "llm", "agent", "sast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# Live introspection executes / connects to the target server, so it is opt-in.
live = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
palisade = "palisade.cli:app"

[project.urls]
Homepage = "https://github.com/CosmicCoder-X/mcp-palisade"
Issues = "https://github.com/CosmicCoder-X/mcp-palisade/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palisade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer expresses the whole CLI through call expressions in argument
# defaults; B008 is unavoidable and intended here.
"src/palisade/cli.py" = ["B008"]
